<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday ❤️</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;1,400&family=Dancing+Script:wght@700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #0a0008;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    font-family: 'Playfair Display', serif;
  }

  /* Stars background */
  .stars {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
  }
  .star {
    position: absolute;
    width: 2px;
    height: 2px;
    background: white;
    border-radius: 50%;
    animation: twinkle var(--d) ease-in-out infinite alternate;
  }
  @keyframes twinkle {
    from { opacity: 0.1; transform: scale(1); }
    to   { opacity: 0.9; transform: scale(1.6); }
  }

  /* Title */
  .title {
    position: relative;
    z-index: 10;
    font-family: 'Dancing Script', cursive;
    font-size: clamp(1.6rem, 5vw, 2.8rem);
    color: #ffb3c6;
    text-align: center;
    letter-spacing: 0.05em;
    text-shadow: 0 0 30px #ff4d7a88;
    animation: fadeDown 1.5s ease both;
    margin-bottom: 12px;
  }
  @keyframes fadeDown {
    from { opacity: 0; transform: translateY(-20px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* Heart canvas */
  #heartCanvas {
    position: relative;
    z-index: 10;
    display: block;
    max-width: 95vw;
  }

  /* Message */
  .message {
    position: relative;
    z-index: 10;
    margin-top: 16px;
    text-align: center;
    animation: fadeUp 2s 2s ease both;
  }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(20px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .message p {
    font-family: 'Dancing Script', cursive;
    font-size: clamp(1rem, 3.5vw, 1.5rem);
    color: #ffd6e0;
    text-shadow: 0 0 20px #ff4d7a66;
    line-height: 1.7;
  }
  .message .name {
    font-size: clamp(1.2rem, 4.5vw, 2rem);
    color: #ff6b95;
    text-shadow: 0 0 30px #ff4d7aaa;
  }

  /* Floating petals */
  .petal {
    position: fixed;
    font-size: 1.2rem;
    pointer-events: none;
    z-index: 5;
    animation: fall var(--fd) linear infinite;
    opacity: 0;
    top: -30px;
  }
  @keyframes fall {
    0%   { opacity: 0; transform: translateY(0) rotate(0deg); }
    10%  { opacity: 0.8; }
    90%  { opacity: 0.6; }
    100% { opacity: 0; transform: translateY(110vh) rotate(720deg); }
  }
</style>
</head>
<body>

<div class="stars" id="stars"></div>

<div class="title">Happy Birthday, My Love 🌹</div>

<canvas id="heartCanvas"></canvas>

<div class="message">
  <p>วันนี้เป็นวันที่พิเศษที่สุด<br>เพราะเธอมาเกิดมาในโลกนี้</p>
  <br>
  <p class="name">I love you ❤️</p>
</div>

<script>
// ---- Stars ----
const starsEl = document.getElementById('stars');
for (let i = 0; i < 120; i++) {
  const s = document.createElement('div');
  s.className = 'star';
  s.style.cssText = `left:${Math.random()*100}%;top:${Math.random()*100}%;--d:${1.5+Math.random()*3}s;animation-delay:${Math.random()*3}s`;
  starsEl.appendChild(s);
}

// ---- Floating petals ----
const petalEmojis = ['🌸','🌺','🌹','💕','✨'];
for (let i = 0; i < 18; i++) {
  const p = document.createElement('div');
  p.className = 'petal';
  p.textContent = petalEmojis[Math.floor(Math.random()*petalEmojis.length)];
  p.style.cssText = `left:${Math.random()*100}%;--fd:${4+Math.random()*8}s;animation-delay:${Math.random()*8}s;font-size:${0.8+Math.random()*0.8}rem`;
  document.body.appendChild(p);
}

// ---- Heart word cloud ----
const canvas = document.getElementById('heartCanvas');
const ctx = canvas.getContext('2d');

const SIZE = Math.min(window.innerWidth * 0.9, 520);
canvas.width = SIZE;
canvas.height = SIZE;

// Heart parametric points
function heartPoints(n) {
  const pts = [];
  for (let t = 0; t < Math.PI * 2; t += 0.01) {
    const x = 16 * Math.pow(Math.sin(t), 3);
    const y = -(13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t));
    pts.push([x, y]);
  }
  return pts;
}

const rawPts = heartPoints();
// Normalize to canvas
const xs = rawPts.map(p=>p[0]), ys = rawPts.map(p=>p[1]);
const minX=Math.min(...xs),maxX=Math.max(...xs),minY=Math.min(...ys),maxY=Math.max(...ys);
const pad = SIZE * 0.08;
const scaleX = (SIZE-pad*2)/(maxX-minX);
const scaleY = (SIZE-pad*2)/(maxY-minY);
const scale = Math.min(scaleX,scaleY);
const offX = pad + (SIZE-pad*2-(maxX-minX)*scale)/2 - minX*scale;
const offY = pad + (SIZE-pad*2-(maxY-minY)*scale)/2 - minY*scale;

const pts = rawPts.map(([x,y])=>[x*scale+offX, y*scale+offY]);

// Words to scatter along heart
const words = [
  'I love you','รักเธอ','Happy Birthday','ฉันรักเธอ',
  '❤️','Forever','Always','My love','เธอคือทุกอย่าง',
  'My heart','สุขสันต์วันเกิด','Mine','You & me'
];

let frame = 0;
const wordObjs = [];

// Seed words along the path
const step = Math.max(1, Math.floor(pts.length / 80));
pts.forEach(([x,y], i) => {
  if (i % step !== 0) return;
  wordObjs.push({
    x, y,
    word: words[Math.floor(Math.random()*words.length)],
    size: 8 + Math.random()*7,
    alpha: 0,
    delay: Math.random()*180,
    phase: Math.random()*Math.PI*2,
    color: Math.random() > 0.5 ? '#ff6b95' : '#ffb3c6',
    bright: Math.random() > 0.7
  });
});

function draw() {
  ctx.clearRect(0, 0, SIZE, SIZE);

  // Glow layer
  ctx.save();
  ctx.globalAlpha = 0.06;
  ctx.strokeStyle = '#ff4d7a';
  ctx.lineWidth = 18;
  ctx.filter = 'blur(12px)';
  ctx.beginPath();
  pts.forEach(([x,y],i) => i===0 ? ctx.moveTo(x,y) : ctx.lineTo(x,y));
  ctx.closePath();
  ctx.stroke();
  ctx.restore();

  frame++;

  wordObjs.forEach(w => {
    if (frame < w.delay) return;
    w.alpha = Math.min(1, w.alpha + 0.018);
    const pulse = 0.7 + 0.3 * Math.sin(frame * 0.03 + w.phase);
    const alpha = w.alpha * pulse;

    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.font = `${w.size}px 'Dancing Script', cursive`;
    ctx.fillStyle = w.bright ? '#ffffff' : w.color;
    ctx.shadowColor = '#ff4d7a';
    ctx.shadowBlur = w.bright ? 14 : 6;
    ctx.fillText(w.word, w.x - ctx.measureText(w.word).width/2, w.y);
    ctx.restore();
  });

  requestAnimationFrame(draw);
}
draw();
</script>
</body>
</html>
